[package]
name = "blri"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.6.6", features = ["derive"] }
crc = "3.4.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
inquire = "0.9.4"
serialport = { version = "4.10", default-features = false }
object = "0.40.0"
same-file = "1.0.6"
bouffalo-rt = { path = "../bouffalo-rt", features = ["image_fuse"] }
ctrlc = "3.5"
crossterm = "0.29"
colored = "3.1"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
home = "0.5"

[dev-dependencies]
tempfile = "3.27.0"
