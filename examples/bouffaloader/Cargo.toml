[package]
name = "bouffaloader"
version = "0.0.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bouffalo-hal = { path = "../../bouffalo-hal", features = ["bl808"] }
bouffalo-rt = { path = "../../bouffalo-rt", features = ["bl808-dsp"] }
panic-halt = "1.0.0"
embedded-time = "0.12.1"
embedded-cli = "0.2.1"
embedded-io = "0.7.1"
# embedded-cli 0.2.1 still uses embedded-io 0.6.
embedded-io-06 = { package = "embedded-io", version = "0.6.1" }
embedded-hal = "1.0.0"
heapless = { version = "0.9.3", features = ["serde"] }
riscv = "0.16.1"
embedded-sdmmc = "0.10.0"
picotoml = { git = "https://github.com/rustsbi/poplar", branch = "refactor/riscv", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-device-tree = { git = "https://github.com/rustsbi/serde-device-tree", rev = "ffb4855f", default-features = false, features = ["ser"]}

[[bin]]
name = "bouffaloader"
test = false
bench = false
